name: Container validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  single-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment manifests
        run: docker compose -f docker-compose.example.yml config
      - name: Build the single-container image
        run: docker build --build-arg VITE_READ_TOKEN=ci-read-token --tag healthquery:ci .
      - name: Smoke test dashboard and API
        run: |
          docker run --detach --rm --name healthquery-ci --publish 8000:8000 \
            --env HEALTHQUERY_INGEST_TOKEN=ci-ingest-token \
            --env HEALTHQUERY_READ_TOKEN=ci-read-token \
            healthquery:ci
          trap 'docker stop healthquery-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "HealthQuery"
          curl --fail --silent --header 'Authorization: Bearer ci-read-token' \
            http://127.0.0.1:8000/api/health/overview >/dev/null
